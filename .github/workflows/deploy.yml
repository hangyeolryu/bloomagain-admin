# ─────────────────────────────────────────────────────────────────────────────
# Firebase Hosting 자동 배포 (main 푸시 시)
#
# 이 앱은 Firebase Hosting의 "web frameworks" 지원으로 배포된다 —
# `firebase deploy`가 내부적으로 `next build`를 돌리고, SSR을 Cloud Run
# 서비스(ssrbloomagainkorea · asia-northeast3 · project bloomagain-korea)로
# 올린다. next.config.ts가 백엔드 크리덴셜을 "빌드 시점에 inline"하므로
# (Firebase 스탠드얼론이 런타임에 .env를 안 읽음) 빌드 전에 .env.production을
# 만들어 공개/서버 값을 모두 채워 준다.
#
# ── 필요한 GitHub Secrets (Settings → Secrets and variables → Actions) ────────
#   인증
#     FIREBASE_SERVICE_ACCOUNT        서비스계정 키 JSON 전체 (아래 IAM 참고)
#   공개 값 (클라이언트 번들에 포함 — 민감하지 않지만 환경마다 달라 Secret로 관리)
#     NEXT_PUBLIC_FIREBASE_API_KEY
#     NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#     NEXT_PUBLIC_FIREBASE_APP_ID
#     NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID   (선택 — 없으면 빈 값)
#   서버 값 (빌드 시 inline)
#     BLOOMAGAIN_BACKEND_URL
#     NICE_BACKEND_URL
#     BACKEND_APP_ID
#     BACKEND_API_KEY
#     TITA_OFFICIAL_SENDER_UID          (선택)
#
# ── 서비스계정 IAM 역할 (bloomagain-korea 프로젝트) ──────────────────────────
#   Firebase Hosting Admin, Cloud Run Admin, Cloud Functions Admin,
#   Artifact Registry Admin, Cloud Build Editor, Service Account User,
#   Firebase Authentication Viewer(또는 Editor). 프레임워크 배포는 Cloud Run/
#   Build를 건드리므로 위 조합이 필요하다. (최소권한은 배포 로그 보며 조정)
#
#   키 발급: GCP Console → IAM → 서비스 계정 → 키 추가(JSON) →
#            그 JSON 전체를 FIREBASE_SERVICE_ACCOUNT Secret에 붙여넣기.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy to Firebase Hosting

on:
  # TODO(2026-09-30): push 트리거는 일시적으로 꺼 둔다.
  # 이 워크플로는 9/24부터 npm ci에서 죽어 단 한 번도 배포에 성공한 적이 없다
  # (그동안의 배포는 전부 수동 firebase deploy). 락파일과 빈 값 가드를 고쳤지만
  # 시크릿 값의 내용과 서비스계정 IAM 권한은 실제로 돌려 봐야 확인된다.
  # 본인인증 장애 복구 당일에 자동 트리거로 프로덕션을 실험하지 않기 위해,
  # 수동 실행으로 한 번 성공을 확인한 뒤 아래 두 줄의 주석을 풀 것.
  #   push:
  #     branches: [main]
  workflow_dispatch: {} # 수동 실행(Actions 탭 → Run workflow)

# 같은 브랜치 배포가 겹치지 않게 — 새 푸시가 오면 진행 중인 배포는 취소.
concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 공개 상수(도메인/프로젝트/버킷)는 .env.example의 고정값을 그대로 쓰고,
      # 나머지 민감·환경별 값은 Secrets에서 채운다. 서버 값은 next.config.js가
      # process.env로 읽어 빌드 시 inline하므로 여기서 함께 넣어 줘야 한다.
      - name: Write .env.production
        run: |
          cat > .env.production <<EOF
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=bloomagain-korea.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=bloomagain-korea
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=bloomagain-korea.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          BLOOMAGAIN_BACKEND_URL=${{ secrets.BLOOMAGAIN_BACKEND_URL }}
          NICE_BACKEND_URL=${{ secrets.NICE_BACKEND_URL }}
          BACKEND_APP_ID=${{ secrets.BACKEND_APP_ID }}
          BACKEND_API_KEY=${{ secrets.BACKEND_API_KEY }}
          TITA_OFFICIAL_SENDER_UID=${{ secrets.TITA_OFFICIAL_SENDER_UID }}
          EOF

      # ── 빈 값 방어 ───────────────────────────────────────────────────────────
      # Secret이 없거나 이름이 틀리면 위 heredoc은 조용히 빈 문자열을 쓴다.
      # 그대로 빌드하면 next.config.js의 env가 ''로 inline되고, 빌드도 배포도
      # "성공"한 채로 런타임에만 죽는다 — 2026-09-30 본인인증 장애가 정확히
      # 이 모양이었다(그때는 next.config.ts 트랜스파일 실패였지만 증상 동일:
      # /api/nice/init이 평문 500). 배포 전에 여기서 멈추는 편이 훨씬 싸다.
      - name: Verify required env values are non-empty
        run: |
          set -euo pipefail
          missing=()
          for key in \
            NEXT_PUBLIC_FIREBASE_API_KEY \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            NEXT_PUBLIC_FIREBASE_APP_ID \
            BLOOMAGAIN_BACKEND_URL \
            NICE_BACKEND_URL \
            BACKEND_APP_ID \
            BACKEND_API_KEY
          do
            value="$(sed -n "s/^${key}=//p" .env.production)"
            if [ -z "$value" ]; then missing+=("$key"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::비어 있는 필수 값: ${missing[*]}"
            echo "GitHub Settings → Secrets and variables → Actions 에서 등록하세요."
            echo "(NICE_BACKEND_URL이 비면 휴대폰 본인인증이 죽습니다.)"
            exit 1
          fi
          echo "필수 값 전부 채워져 있습니다."

      # 서비스계정 JSON을 파일로 쓰고 GOOGLE_APPLICATION_CREDENTIALS로 노출.
      # firebase-tools가 이 경로를 읽어 인증한다(대화형 로그인/토큰 불필요).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # webframeworks는 아직 firebase-tools의 실험 기능이라 명시적으로 켜야 한다.
      # 로컬에서는 `firebase experiments:enable webframeworks`가 홈 디렉터리에
      # 저장돼 있어 보이지 않지만, CI의 npx는 매번 새 설치라 그 상태가 없다.
      # 이걸 안 켜면 배포가 이렇게 죽는다(2026-09-30 첫 수동 실행에서 확인):
      #   Error: Cannot deploy a web framework from source because the
      #          experiment webframeworks is not enabled.
      #
      # 버전을 @latest가 아니라 고정한 이유: @latest면 firebase-tools가 올라갈
      # 때 이 레포에 아무 변경이 없어도 배포가 깨질 수 있다. 15.31.0은
      # 9/30 본인인증 복구 배포를 실제로 성공시킨 버전이다. 올릴 때는 의도적으로
      # 올리고 수동 실행으로 한 번 확인할 것.
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: npx --yes firebase-tools@15.31.0 deploy --only hosting --project bloomagain-korea --non-interactive
